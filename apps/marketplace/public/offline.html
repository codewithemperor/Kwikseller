<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Kwikseller</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #faf7f2; color: #111827; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { text-align: center; padding: 2rem; max-width: 28rem; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #6b7280; margin: 0 0 1.5rem; }
    a { display: inline-block; padding: 0.625rem 1.25rem; background: #F07A22; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your connection and try again.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
